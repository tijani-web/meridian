  <!-- RoundRobin -->
  <text x="180" y="355" text-anchor="middle" fill="#cdd6f4" font-size="13" font-family="sans-serif">RoundRobin</text>
  <rect x="150" y="194" width="60" height="%!d(float64=56.875)" fill="#f38ba8" rx="4"/>
  <text x="180" y="240" text-anchor="middle" fill="#f38ba8" font-size="12" font-family="sans-serif" font-weight="bold">%!f(int=89)%</text>

  <!-- LeastQueue -->
  <text x="360" y="355" text-anchor="middle" fill="#cdd6f4" font-size="13" font-family="sans-serif">LeastQueue</text>
  <rect x="330" y="230" width="60" height="%!d(float64=40.625)" fill="#fab387" rx="4"/>
  <text x="360" y="225" text-anchor="middle" fill="#fab387" font-size="12" font-family="sans-serif" font-weight="bold">%!f(int=104)%</text>

  <!-- KVAware -->
  <text x="540" y="355" text-anchor="middle" fill="#cdd6f4" font-size="13" font-family="sans-serif">KVAware</text>
  <rect x="510" y="215" width="60" height="%!d(float64=47.5)" fill="#89b4fa" rx="4"/>
  <text x="540" y="220" text-anchor="middle" fill="#89b4fa" font-size="12" font-family="sans-serif" font-weight="bold">%!f(int=110)%</text>

  <!-- PrefixAffinity -->
  <text x="720" y="355" text-anchor="middle" fill="#cdd6f4" font-size="13" font-family="sans-serif" font-weight="bold">PrefixAffinity</text>
