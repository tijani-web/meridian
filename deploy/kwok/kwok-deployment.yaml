apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwok-controller
  namespace: kube-system
  labels:
    app: kwok-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kwok-controller
  template:
    metadata:
      labels:
        app: kwok-controller
    spec:
      serviceAccountName: kwok-controller
      containers:
        - name: kwok-controller
          image: registry.k8s.io/kwok/kwok:v0.6.0
          args:
            - --manage-all-nodes=false
            - --manage-nodes-with-annotation=kwok.x-k8s.io/node=fake
            - --manage-single-node=
            - --cidr=10.244.0.0/16
            - --node-ip=10.244.0.1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwok-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwok-controller
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwok-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwok-controller
subjects:
  - kind: ServiceAccount
    name: kwok-controller
    namespace: kube-system
