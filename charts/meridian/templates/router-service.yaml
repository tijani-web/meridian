apiVersion: v1
kind: Service
metadata:
  name: {{ include "meridian.fullname" . }}-router
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.router.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "meridian.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
