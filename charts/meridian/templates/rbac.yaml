kind: ClusterRole
metadata:
  name: {{ include "meridian.fullname" . }}-agent-role
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "meridian.fullname" . }}-agent-binding
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "meridian.fullname" . }}-agent-role
subjects:
  - kind: ServiceAccount
    name: {{ include "meridian.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

---
# ============================================================
# Router ClusterRole & Binding
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "meridian.fullname" . }}-router-role
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
rules:
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "pods", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["meridian.dev"]
    resources: ["inferencedeployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "meridian.fullname" . }}-router-binding
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "meridian.fullname" . }}-router-role
subjects:
  - kind: ServiceAccount
    name: {{ include "meridian.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
