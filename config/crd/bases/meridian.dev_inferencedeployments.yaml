kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: inferencedeployments.meridian.dev
spec:
  group: meridian.dev
  names:
    kind: InferenceDeployment
    listKind: InferenceDeploymentList
    plural: inferencedeployments
    shortNames:
    - id
    - infdep
    singular: inferencedeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.model.name
      name: Model
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .spec.routing.strategy
      name: Strategy
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: InferenceDeployment is the Schema for namespaced GPU model serving
          rollouts and intelligent routing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InferenceDeploymentSpec defines model, engine runtime, replica
              count, canary rollout, and routing.
            properties:
              model:
                description: Model defines the weights location and revision.
                properties:
                  name:
                    description: Name identifies the human-readable model identifier
                      (e.g. "llama-3-8b-instruct").
                    minLength: 1
                    type: string
                  revision:
                    default: main
                    description: Revision specifies the git commit, tag, or version
                      pin of the weights.
                    type: string
                  uri:
                    description: URI points to the cloud storage bucket, huggingface
                      repo, or PVC containing weights.
                    minLength: 1
                    type: string
                required:
                - name
                - uri
                type: object
              replicas:
                default: 1
                description: Replicas is the desired number of serving pods.
                format: int32
                minimum: 0
                type: integer
              resources:
                description: Resources specifies per-replica GPU hardware requirements.
                properties:
                  gpuType:
                    description: GPUType specifies the required accelerator hardware
                      label (e.g., "nvidia-h100").
                    type: string
                  gpusPerReplica:
                    description: GPUsPerReplica is the count of physical GPUs needed
                      per replica.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - gpusPerReplica
                type: object
              rollout:
                description: Rollout governs progressive deployment steps and metric
                  verification.
                properties:
                  maxUnavailable:
                    anyOf:
                    - type: integer
                    - type: string
                    description: MaxUnavailable defines the maximum number or percentage
                      of unavailable replicas during updates.
                    x-kubernetes-int-or-string: true
                  steps:
                    description: Steps specifies the progressive weight stages for
                      a Canary rollout.
                    items:
                      description: RolloutStep defines an individual traffic shift
                        weight and soak duration.
                      properties:
                        analysis:
                          description: Analysis defines the automated promotion criteria
                            evaluated during the pause.
                          properties:
                            maxErrorRate:
                              description: MaxErrorRate is the maximum allowable fractional
                                error rate (e.g. 0.01 for 1%).
                              type: string
                            maxTTFTMillis:
                              description: MaxTTFTMillis is the upper bound on 99th
                                percentile Time-To-First-Token in milliseconds.
                              format: int32
                              type: integer
                          type: object
                        pauseSeconds:
                          default: 30
                          description: PauseSeconds is the duration to soak at this
                            weight before evaluating analysis and advancing.
                          format: int32
                          type: integer
                        weight:
                          description: Weight is the percentage of total traffic allocated
                            to the new canary revision (0-100).
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                      required:
                      - weight
                      type: object
                    type: array
                  strategy:
                    default: Canary
                    description: Strategy determines how revisions are phased in (Canary
                      or BlueGreen).
                    enum:
                    - Canary
                    - BlueGreen
                    type: string
                required:
                - strategy
                type: object
              routing:
                description: Routing specifies algorithm and load shedding thresholds
                  for the Meridian router.
                properties:
                  loadShedding:
                    description: LoadShedding configures HTTP 429 backpressure parameters.
                    properties:
                      maxQueueDepth:
                        default: 100
                        description: MaxQueueDepth is the aggregate queue threshold
                          beyond which new requests are shed with HTTP 429.
                        format: int32
                        minimum: 1
                        type: integer
                      priorityClasses:
                        description: PriorityClasses lists priority tiers eligible
                          to bypass load shedding under pressure.
                        items:
                          type: string
                        type: array
                    required:
                    - maxQueueDepth
                    type: object
                  strategy:
                    default: LeastQueue
                    description: Strategy denotes the algorithm (LeastQueue, KVAware,
                      PrefixAffinity, RoundRobin).
                    enum:
                    - LeastQueue
                    - KVAware
                    - PrefixAffinity
                    - RoundRobin
                    type: string
                required:
                - strategy
                type: object
              runtime:
                description: Runtime defines the container image and serving arguments.
                properties:
                  args:
                    description: Args provides CLI flags passed to the model server
                      executable.
                    items:
                      type: string
                    type: array
                  image:
                    description: Image is the container image for the inference server
                      engine (e.g. vLLM or vllm-emu).
                    minLength: 1
                    type: string
                  metricsPath:
                    default: /metrics
                    description: MetricsPath is the HTTP path returning Prometheus
                      format engine metrics (e.g. /metrics).
                    type: string
                  port:
                    default: 8000
                    description: Port is the HTTP port exposed by the model server
                      for OpenAI-compatible completions.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                required:
                - image
                - port
                type: object
              warmup:
                description: Warmup gates routing until replicas pass warm-up queries.
                properties:
                  minWarmRequests:
                    default: 1
                    description: MinWarmRequests requires this number of synthetic
                      warmup requests to succeed before marking warm.
                    format: int32
                    minimum: 0
                    type: integer
                  probe:
                    description: Probe specifies a standard Kubernetes readiness probe
                      for initial container startup.
                    properties:
                      exec:
                        description: Exec specifies a command to execute in the container.
                        properties:
                          command:
                            description: |-
                              Command is the command line to execute inside the container, the working directory for the
                              command  is root ('/') in the container's filesystem. The command is simply exec'd, it is
                              not run inside a shell, so traditional shell instructions ('|', etc) won't work. To use
                              a shell, you need to explicitly call out to that shell.
                              Exit status of 0 is treated as live/healthy and non-zero is unhealthy.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      failureThreshold:
                        description: |-
                          Minimum consecutive failures for the probe to be considered failed after having succeeded.
                          Defaults to 3. Minimum value is 1.
                        format: int32
                        type: integer
                      grpc:
                        description: GRPC specifies a GRPC HealthCheckRequest.
                        properties:
                          mode:
                            description: |-
                              mode specifies the connection mode for the gRPC health probe.
                              Set to "TLS" to use TLS without certificate verification.
                              Set to "Plaintext" to use a plaintext (insecure) connection explicitly.
                              If not specified, the probe uses a plaintext (insecure) connection.
                            type: string
                          port:
                            description: Port number of the gRPC service. Number must
                              be in the range 1 to 65535.
                            format: int32
                            type: integer
                          service:
                            default: ""
                            description: |-
                              Service is the name of the service to place in the gRPC HealthCheckRequest
                              (see https://github.com/grpc/grpc/blob/master/doc/health-checking.md).

                              If this is not specified, the default behavior is defined by gRPC.
                            type: string
                        required:
                        - port
                        type: object
                      httpGet:
                        description: HTTPGet specifies an HTTP GET request to perform.
                        properties:
                          host:
                            description: |-
                              Host name to connect to, defaults to the pod IP. You probably want to set
                              "Host" in httpHeaders instead.
                            type: string
                          httpHeaders:
                            description: Custom headers to set in the request. HTTP
                              allows repeated headers.
                            items:
                              description: HTTPHeader describes a custom header to
                                be used in HTTP probes
                              properties:
                                name:
                                  description: |-
                                    The header field name.
                                    This will be canonicalized upon output, so case-variant names will be understood as the same header.
                                  type: string
                                value:
                                  description: The header field value
                                  type: string
                              required:
                              - name
                              - value
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          path:
                            description: Path to access on the HTTP server.
                            type: string
                          port:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              Name or number of the port to access on the container.
                              Number must be in the range 1 to 65535.
                              Name must be an IANA_SVC_NAME.
                            x-kubernetes-int-or-string: true
                          protocol:
                            description: |-
                              Protocol selects the wire protocol for the probe connection.
                              Nil defaults to HTTP/1.1.
                            type: string
                          scheme:
                            description: |-
                              Scheme to use for connecting to the host.
                              Defaults to HTTP.
                            type: string
                        required:
                        - port
                        type: object
                      initialDelaySeconds:
                        description: |-
                          Number of seconds after the container has started before liveness probes are initiated.
                          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
                        format: int32
                        type: integer
                      periodSeconds:
                        description: |-
                          How often (in seconds) to perform the probe.
                          Default to 10 seconds. Minimum value is 1.
                        format: int32
                        type: integer
                      successThreshold:
                        description: |-
                          Minimum consecutive successes for the probe to be considered successful after having failed.
                          Defaults to 1. Must be 1 for liveness and startup. Minimum value is 1.
                        format: int32
                        type: integer
                      tcpSocket:
                        description: TCPSocket specifies a connection to a TCP port.
                        properties:
                          host:
                            description: 'Optional: Host name to connect to, defaults
                              to the pod IP.'
                            type: string
                          port:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              Number or name of the port to access on the container.
                              Number must be in the range 1 to 65535.
                              Name must be an IANA_SVC_NAME.
                            x-kubernetes-int-or-string: true
                        required:
                        - port
                        type: object
                      terminationGracePeriodSeconds:
                        description: |-
                          Optional duration in seconds the pod needs to terminate gracefully upon probe failure.
                          The grace period is the duration in seconds after the processes running in the pod are sent
                          a termination signal and the time when the processes are forcibly halted with a kill signal.
                          Set this value longer than the expected cleanup time for your process.
                          If this value is nil, the pod's terminationGracePeriodSeconds will be used. Otherwise, this
                          value overrides the value provided by the pod spec.
                          Value must be non-negative integer. The value zero indicates stop immediately via
                          the kill signal (no opportunity to shut down).
                          This is a beta field and requires enabling ProbeTerminationGracePeriod feature gate.
                          Minimum value is 1. spec.terminationGracePeriodSeconds is used if unset.
                        format: int64
                        type: integer
                      timeoutSeconds:
                        description: |-
                          Number of seconds after which the probe times out.
                          Defaults to 1 second. Minimum value is 1.
                          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
                        format: int32
                        type: integer
                    type: object
                  readinessPromptPath:
                    description: ReadinessPromptPath points to an HTTP endpoint or
                      test prompt to exercise the model engine.
                    type: string
                type: object
            required:
            - model
            - replicas
            - runtime
            type: object
          status:
            description: InferenceDeploymentStatus defines observed revisions, routing
              table states, and conditions.
            properties:
              conditions:
                description: Conditions represent observations of the deployment's
                  status (e.g. Available, Progressing).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration reflects the most recent metadata
                  generation observed by the controller.
                format: int64
                type: integer
              revisions:
                description: Revisions lists all active model revisions and their
                  assigned traffic weights.
                items:
                  description: RevisionStatus tracks the runtime readiness and traffic
                    share of an active model revision.
                  properties:
                    name:
                      description: Name is the unique revision name (derived from
                        deployment name and revision hash).
                      type: string
                    readyReplicas:
                      description: ReadyReplicas is the count of serving pods currently
                        passing readiness checks.
                      format: int32
                      minimum: 0
                      type: integer
                    warm:
                      description: Warm indicates whether the revision has satisfied
                        warmup probe requirements.
                      type: boolean
                    weight:
                      description: Weight is the current percentage of incoming requests
                        routed to this revision.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                  required:
                  - name
                  - readyReplicas
                  - warm
                  - weight
                  type: object
                type: array
            type: object
        type: object
