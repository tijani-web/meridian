<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="100%" stop-color="#121824" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="100%" stop-color="#1c273c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#39c5cf" />
    </marker>
  </defs>

  <rect width="1000" height="720" fill="url(#bg-grad)" rx="16" />

  <!-- Title Badge -->
  <g transform="translate(40, 30)">
    <rect width="920" height="48" rx="8" fill="#1f293d" stroke="#2d3d5a" stroke-width="1.5" />
    <text x="24" y="30" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" letter-spacing="1.5">MERIDIAN</text>
    <text x="140" y="30" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14">— Kubernetes-Native GPU Fleet Control Plane Architecture</text>
  </g>

  <!-- Control Plane Boundary -->
  <g transform="translate(40, 95)">
    <rect width="920" height="425" rx="14" fill="#0f1624" stroke="#26354f" stroke-width="1.5" />
    <text x="24" y="28" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" text-transform="uppercase" letter-spacing="1">Control Plane Components</text>

    <!-- Manager Box -->
    <g transform="translate(20, 45)" filter="url(#shadow)">
      <rect width="425" height="175" rx="10" fill="url(#card-grad)" stroke="#388bfd" stroke-width="1.5" />
      <rect width="425" height="34" rx="10" fill="#1f6feb" />
      <rect y="20" width="425" height="14" fill="#1f6feb" />
      <text x="16" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Meridian Manager (HA 2-Replica, Leader Lease)</text>
      <g transform="translate(16, 52)" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <text y="12">• <tspan font-weight="600" fill="#ffffff">GPUWorkload Controller:</tspan> FSM, SSA, Finalizers, Pod-gate</text>
        <text y="36">• <tspan font-weight="600" fill="#ffffff">GPUQueue Controller:</tspan> Fair-share, Quota borrow/lend</text>
        <text y="60">• <tspan font-weight="600" fill="#ffffff">InferenceDeployment Controller:</tspan> Canary rollout &amp; auto-rollback</text>
        <text y="84">• <tspan font-weight="600" fill="#ffffff">Node Health Controller:</tspan> NVML/DCGM XID &amp; flap-damping</text>
        <text y="108">• <tspan font-weight="600" fill="#ffffff">Admission Webhooks:</tspan> Strict immutability &amp; spec validation</text>
      </g>
    </g>

    <!-- Scheduler Box -->
    <g transform="translate(475, 45)" filter="url(#shadow)">
      <rect width="425" height="175" rx="10" fill="url(#card-grad)" stroke="#39c5cf" stroke-width="1.5" />
      <rect width="425" height="34" rx="10" fill="#008080" />
      <rect y="20" width="425" height="14" fill="#008080" />
      <text x="16" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Meridian Scheduler (Second Scheduler Plugin)</text>
      <g transform="translate(16, 52)" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <text y="12">• <tspan font-weight="600" fill="#ffffff">Filter Plugin:</tspan> GPU model, NVLink topology &amp; quota check</text>
        <text y="36">• <tspan font-weight="600" fill="#ffffff">Score Plugin:</tspan> Topology-aware bin-packing &amp; packing score</text>
        <text y="60">• <tspan font-weight="600" fill="#ffffff">Permit Plugin:</tspan> Gang scheduling synchronization (all or none)</text>
        <text y="84">• <tspan font-weight="600" fill="#ffffff">Reserve Plugin:</tspan> Tenant GPU quota reservation tracking</text>
        <text y="108">• <tspan font-weight="600" fill="#ffffff">Decision Recorder:</tspan> Persistent decision records for meridianctl explain</text>
      </g>
    </g>

    <!-- Agent Box -->
    <g transform="translate(20, 235)" filter="url(#shadow)">
      <rect width="425" height="165" rx="10" fill="url(#card-grad)" stroke="#a371f7" stroke-width="1.5" />
      <rect width="425" height="34" rx="10" fill="#8957e5" />
      <rect y="20" width="425" height="14" fill="#8957e5" />
      <text x="16" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Node Health Agent (DaemonSet)</text>
      <g transform="translate(16, 52)" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <text y="12">• <tspan font-weight="600" fill="#ffffff">NVML &amp; DCGM Scraper:</tspan> Real XID fatal events &amp; uncorrectable ECC</text>
        <text y="36">• <tspan font-weight="600" fill="#ffffff">Flap Damping:</tspan> Exponential backoff quarantine for flaky GPUs</text>
        <text y="60">• <tspan font-weight="600" fill="#ffffff">Node Tainting:</tspan> Automatic NoSchedule / NoExecute taint application</text>
        <text y="84">• <tspan font-weight="600" fill="#ffffff">Topology Discovery:</tspan> PCIe / NVLink mesh label publication</text>
      </g>
    </g>

    <!-- Router Box -->
    <g transform="translate(475, 235)" filter="url(#shadow)">
      <rect width="425" height="165" rx="10" fill="url(#card-grad)" stroke="#f0883e" stroke-width="1.5" />
      <rect width="425" height="34" rx="10" fill="#bd561d" />
      <rect y="20" width="425" height="14" fill="#bd561d" />
      <text x="16" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Inference Request Router (vLLM Proxy)</text>
      <g transform="translate(16, 52)" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        <text y="12">• <tspan font-weight="600" fill="#ffffff">Routing Strategies:</tspan> RoundRobin, LeastQueue, KVAware, Prefix</text>
        <text y="36">• <tspan font-weight="600" fill="#ffffff">Streaming Proxy:</tspan> Real-time Server-Sent Events (SSE) token proxy</text>
        <text y="60">• <tspan font-weight="600" fill="#ffffff">Load Shedding:</tspan> HTTP 429 backpressure on KV cache exhaustion</text>
        <text y="84">• <tspan font-weight="600" fill="#ffffff">Metrics Scraping:</tspan> Continuous vLLM Prometheus metrics caching</text>
      </g>
    </g>
  </g>

  <!-- Kubernetes API / Etcd Bar -->
  <g transform="translate(40, 535)">
    <rect width="920" height="42" rx="8" fill="#1b2537" stroke="#3d4f6f" stroke-width="1.5" />
    <text x="460" y="26" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14">Kubernetes API Server &amp; Informer Watch Stream (CRDs, Pods, Leases, Nodes)</text>
  </g>

  <!-- Hardware / Execution Layer -->
  <g transform="translate(40, 595)">
    <!-- Real Nodes -->
    <g transform="translate(0, 0)">
      <rect width="445" height="95" rx="10" fill="#131b29" stroke="#238636" stroke-width="1.5" />
      <text x="20" y="28" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">REAL WORKER NODES (kind / Bare-Metal / Cloud)</text>
      <text x="20" y="52" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• Physical GPUs (H100, A100, L40S, A10G) or KinD local nodes</text>
      <text x="20" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Real NVIDIA container toolkit, DCGM-exporter, host NVML runtime</text>
    </g>

    <!-- Simulated Fleet -->
    <g transform="translate(475, 0)">
      <rect width="445" height="95" rx="10" fill="#131b29" stroke="#db6d28" stroke-width="1.5" />
      <text x="20" y="28" fill="#f0883e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13">SIMULATED SCALE FLEET (KWOK &amp; Emulators)</text>
      <text x="20" y="52" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">• 500 to 2,000 KWOK Nodes with authentic nvidia.com/gpu resources</text>
      <text x="20" y="74" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">tools/vllm-emu + tools/gpu-fault-injector + tools/loadgen</text>
    </g>
  </g>
</svg>
